<!-- EcoTrack/frontend/index.html -->
<!-- This is the only real HTML page in the whole app. React builds every screen
     inside the <div id="root"> below - that is what "single page application" means. -->
<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page draw under the notch/home-indicator on
         a phone with a cutout - the app's own layout pads around it with
         env(safe-area-inset-*) instead of the OS just cropping the page. Without
         this, the same app wrapped in Capacitor for Android/iOS renders behind
         a solid bar of dead space at the top and bottom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>EcoTrack - Carbon Footprint Tracker</title>
    <meta
      name="description"
      content="Track, understand and reduce your personal carbon footprint across seven categories. Built for SDG 13: Climate Action."
    />
    <!-- Colours the browser chrome on mobile to match the light theme. The
         value is kept in step with --eco-bg by ThemeContext when the user
         toggles; this is only the pre-JavaScript default. -->
    <meta name="theme-color" content="#efede4" />

    <!-- Without these, pasting the site's link into WhatsApp, iMessage,
         LinkedIn or Twitter/X showed a bare URL with no title, description or
         image - the single most common "looks unfinished" tell for a link
         nobody has seen before. og-image.png is generated by
         backend/generate_og_image.py, not hand-drawn. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EcoTrack" />
    <meta property="og:title" content="EcoTrack - Measure your footprint, then bring it down" />
    <meta
      property="og:description"
      content="Track, understand and reduce your personal carbon footprint across seven categories. Free, no card required."
    />
    <meta property="og:url" content="https://ecotrackapp.web.app" />
    <meta property="og:image" content="https://ecotrackapp.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EcoTrack - Measure your footprint, then bring it down" />
    <meta
      name="twitter:description"
      content="Track, understand and reduce your personal carbon footprint across seven categories. Free, no card required."
    />
    <meta name="twitter:image" content="https://ecotrackapp.web.app/og-image.png" />

    <!-- Makes the site installable straight from the browser (Android Chrome's
         "Add to Home screen" / iOS Safari's "Add to Home Screen") - a real,
         completely free app icon on a phone's home screen with no store, no
         review and no fee, independent of the Capacitor build in android/ and
         ios/ which is what actually goes to the Play Store / App Store. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.webp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EcoTrack" />

    <!-- preconnect tells the browser to open the connection early, which makes
         the fonts arrive noticeably faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ONE FAMILY, EVERYWHERE.
         Bricolage Grotesque (display headings) and IBM Plex Mono (every
         measured value - the amber-tinted "instrument reading" treatment)
         were dropped: on a real screen, next to a real admin console, the
         combination read as an AI-generated template rather than a formal
         product. Inter now carries headings, labels and figures alike,
         differentiated by weight and size rather than by typeface or a
         separate accent colour - the conventional look of a real dashboard.
         See index.css's --font-display/--font-mono definitions and
         .eco-readout for where this is wired through. -->
    <!-- crossorigin="anonymous": without it, the browser loads this
         stylesheet in "no-cors" mode, which is fine for normal rendering
         but makes document.styleSheets[n].cssRules throw a SecurityError
         for any script that tries to read it - exactly what
         WrappedCard.jsx and Journey.jsx's "download as image" buttons do
         (html-to-image inlines every stylesheet's rules into the exported
         PNG). Google Fonts sends a real Access-Control-Allow-Origin: *, so
         this is safe to opt into - caught live as a real, deployed
         SecurityError while verifying Journey.jsx's download button, not a
         hypothetical. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- The same brand leaf mark as the mobile app icon (generated by
         backend/generate_app_icons.py), not the placeholder emoji this used
         to be - a tab full of real site icons next to one emoji glyph was
         the tell that this one wasn't actually designed. -->
    <!-- Explicit 16/32 entries so the browser tab uses a crisp, purpose-built
         tiny render (see backend/generate_web_favicon.py's TINY_SIZES) rather
         than shrinking the 48px one itself, which is what made the tab icon
         look muddy before this. sizes="any" on the SVG-less webp fallback
         chain lets a browser that ignores sizes matching just pick the first
         it understands. -->
    <link rel="icon" href="/icons/icon-16.webp" type="image/webp" sizes="16x16" />
    <link rel="icon" href="/icons/icon-32.webp" type="image/webp" sizes="32x32" />
    <link rel="icon" href="/icons/icon-48.webp" type="image/webp" sizes="48x48" />
    <link rel="icon" href="/icons/icon-192.webp" type="image/webp" sizes="192x192" />

    <!-- Was inline here - moved to its own file (public/theme-init.js) so
         the page's Content-Security-Policy can drop 'unsafe-inline' from
         script-src. Still runs before React and before first paint either
         way; a plain <script src> blocks the parser exactly like an inline
         block did. -->
    <script src="/theme-init.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <!-- type="module" lets the browser use modern import syntax directly -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

# EcoTrack backend — Render Blueprint
# ---------------------------------------------------------------------------
# This deploys the Flask API. In the Render dashboard:
#   New +  >  Blueprint  >  connect this GitHub repo  >  Render reads this file.
# It creates one free web service. You then set the four secret env vars marked
# "sync: false" in the dashboard (see DEPLOY.md). Everything else is filled in.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: ecotrack-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # gunicorn is the production server; it must bind to Render's $PORT.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: ecotrack-carbon-tracker-4f2a1
      # A strong random Flask secret, generated by Render automatically.
      - key: SECRET_KEY
        generateValue: true
      # --- secrets: set these in the Render dashboard, not here ---
      # The WHOLE serviceAccountKey.json file, pasted as one value.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Your Gemini key (optional; blank just hides the assistant).
      - key: GEMINI_API_KEY
        sync: false
      # Comma-separated admin emails (e.g. nebinstanly12@gmail.com).
      - key: ADMIN_EMAILS
        sync: false
      # The frontend origin allowed to call this API. After the frontend is
      # live, set this to: https://ecotrack-carbon-tracker-4f2a1.web.app
      - key: CORS_ORIGINS
        sync: false
